<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/> <!-- emerald-500, brighter green, top-left -->
      <stop offset="100%" stop-color="#059669"/> <!-- emerald-600, darker green, bottom-right -->
    </linearGradient>
  </defs>
  
  <!-- Rounded square background with gradient -->
  <rect x="0" y="0" width="512" height="512" rx="80" fill="url(#greenGradient)"/>
  
  <!-- White "Cg" text -->
  <text 
    x="256" 
    y="250" 
    font-family="Rajdhani, mono, Arial Black, Arial, monospace" 
    font-size="290" 
    font-weight="700" 
    fill="white" 
    text-anchor="middle" 
    dominant-baseline="central"
    letter-spacing="-2"
  >
    Cg
  </text>
</svg>


