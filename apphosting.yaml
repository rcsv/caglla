# Firebase App Hosting Configuration
# https://firebase.google.com/docs/app-hosting

# アプリケーション情報
appConfig:
  # package.jsonから取得した情報
  name: caglla
  version: 1.8.2
  description: Travel management app inspired by wanderlog
  private: true

# ランタイム設定
runConfig:
  # Node.js 22を使用（package.jsonのvolta設定に合わせる）
  runtime: nodejs22
  
  # 環境変数の設定（直接設定 - 開発用）
  env:
    # Firebase Configuration (クライアント側) - 直接設定
    - variable: NEXT_PUBLIC_FIREBASE_API_KEY
      value: "your-firebase-api-key"
    - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      value: "caglla-fb.firebaseapp.com"
    - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
      value: "caglla-fb"
    - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
      value: "caglla-fb.appspot.com"
    - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
      value: "your-messaging-sender-id"
    - variable: NEXT_PUBLIC_FIREBASE_APP_ID
      value: "your-firebase-app-id"
    
    # Firebase Admin SDK Configuration (サーバー側) - 直接設定
    - variable: FIREBASE_PROJECT_ID
      value: "caglla-fb"
    - variable: FIREBASE_CLIENT_EMAIL
      value: "your-service-account@caglla-fb.iam.gserviceaccount.com"
    - variable: FIREBASE_PRIVATE_KEY
      value: "your-private-key"
    
    # Google APIs Configuration - 直接設定
    - variable: NEXT_PUBLIC_GOOGLE_PLACES_API_KEY
      value: "your-google-places-api-key"
    - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
      value: "your-google-maps-api-key"
    - variable: NEXT_PUBLIC_GOOGLE_MAP_ID
      value: "your-google-map-id"
    
    # App URL - 直接設定
    - variable: NEXT_PUBLIC_APP_URL
      value: "https://your-app-url.com"
    
    # Optional APIs - 直接設定
    - variable: NEXT_PUBLIC_UNSPLASH_APP_ID
      value: "your-unsplash-app-id"
    - variable: NEXT_PUBLIC_UNSPLASH_ACCESS_KEY
      value: "your-unsplash-access-key"
    - variable: UNSPLASH_SECRET_KEY
      value: "your-unsplash-secret-key"
    
    # External APIs - 直接設定
    - variable: TRIPADVISOR_API_KEY
      value: "your-tripadvisor-api-key"
    - variable: FOURSQUARE_API_KEY
      value: "your-foursquare-api-key"
    - variable: SELECTPDF_API_KEY
      value: "your-selectpdf-api-key"
    
    # SendGrid Configuration - 直接設定
    - variable: SENDGRID_API_KEY
      value: "your-sendgrid-api-key"

# ビルド設定
buildConfig:
  # ビルドコマンド（pnpmを使用、frozen-lockfileを無効化）
  buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
  
  # 出力ディレクトリ（Next.jsのデフォルト）
  outputDirectory: .next
  
  # Node.js バージョン
  nodeVersion: 22
  
  # pnpmバージョン指定（現在のバージョン）
  pnpmVersion: 10.18.3
  
  # package.jsonの依存関係情報（参考）
  dependencies:
    # 主要な依存関係
    next: "^14.2.33"
    react: "18.3.1"
    react-dom: "18.3.1"
    typescript: "^5.9.3"
    firebase: "^10.14.1"
    firebase-admin: "^13.5.0"
    "@google-cloud/secret-manager": "^6.1.1"
    "@googlemaps/js-api-loader": "^1.16.10"
    "@iconify/react": "6.0.2"
    "@dnd-kit/core": "^6.3.1"
    "@dnd-kit/sortable": "^10.0.0"
    "@dnd-kit/utilities": "^3.2.2"
    "@types/qrcode": "^1.5.5"
    qrcode: "^1.5.4"
    axios: "^1.12.2"
    mysql2: "^3.15.2"
    firebase-tools: "^14.20.0"
  
  # package.jsonのスクリプト情報（参考）
  scripts:
    dev: "next dev"
    build: "next build"
    start: "next start"
    lint: "next lint"
    migrate: "ts-node src/migrate.ts"
    flush-itineraries: "ts-node scripts/flush-itineraries.ts"
    manage-itineraries: "ts-node scripts/manage-itineraries.ts"
    simple-flush: "ts-node scripts/simple-flush.ts"
    admin-flush: "ts-node scripts/admin-flush.ts"
    api-flush: "ts-node scripts/api-flush.ts"
    setup-secrets: "ts-node scripts/setup-secrets.ts"

# デプロイ設定
deployConfig:
  # リージョン（アジア太平洋地域を推奨）
  region: asia-northeast1
  
  # スケーリング設定
  scaling:
    minInstances: 1
    maxInstances: 10
  
  # ヘルスチェック設定
  healthCheck:
    path: /api/health
    timeoutSeconds: 30
  
  # カスタムドメイン設定（必要に応じて）
  # customDomains:
  #   - your-domain.com
  #   - www.your-domain.com

# セキュリティ設定
security:
  # HTTPS強制
  forceHttps: true
  
  # セキュリティヘッダー
  headers:
    - name: X-Frame-Options
      value: DENY
    - name: X-Content-Type-Options
      value: nosniff
    - name: X-XSS-Protection
      value: 1; mode=block
    - name: Referrer-Policy
      value: strict-origin-when-cross-origin

# ログ設定
logging:
  level: info
  
# モニタリング設定
monitoring:
  enabled: true
