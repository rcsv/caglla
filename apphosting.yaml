# Firebase App Hosting Configuration - 最小限検証版
# https://firebase.google.com/docs/app-hosting

# アプリケーション情報
appConfig:
  name: caglla
  version: 1.8.2
  description: Travel management app - minimal test
  private: true

# ランタイム設定
runConfig:
  runtime: nodejs22
  
  # 最小限の環境変数（ハードコード値で検証）
  env:
    # Firebase Configuration (クライアント側) - ハードコード
    - variable: NEXT_PUBLIC_FIREBASE_API_KEY
      value: AIzaSyBzEYw-gYSfPHQICFtaRB4gMzMkR5z8EN4
    - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      value: caglla-fb.firebaseapp.com
    - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
      value: caglla-fb
    - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
      value: caglla-fb.firebasestorage.app
    - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
      value: 17375032053
    - variable: NEXT_PUBLIC_FIREBASE_APP_ID
      value: 1:17375032053:web:e1f99ead356f5421c1cbbc
    
    # Firebase Admin SDK Configuration (サーバー側) - Secret Managerから取得
    - variable: FIREBASE_PROJECT_ID
      secret: projects/caglla-fb/secrets/FIREBASE_PROJECT_ID/versions/latest
    - variable: FIREBASE_CLIENT_EMAIL
      secret: projects/caglla-fb/secrets/FIREBASE_CLIENT_EMAIL/versions/latest
    - variable: FIREBASE_PRIVATE_KEY
      secret: projects/caglla-fb/secrets/FIREBASE_PRIVATE_KEY/versions/latest

# ビルド設定
buildConfig:
  buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
  outputDirectory: .next
  nodeVersion: 22
  pnpmVersion: 10.18.3

# デプロイ設定
deployConfig:
  region: asia-northeast1
  scaling:
    minInstances: 1
    maxInstances: 3
  healthCheck:
    path: /api/health
    timeoutSeconds: 30

# セキュリティ設定
security:
  forceHttps: true
  headers:
    - name: X-Frame-Options
      value: DENY
    - name: X-Content-Type-Options
      value: nosniff
    - name: X-XSS-Protection
      value: 1; mode=block
    - name: Referrer-Policy
      value: strict-origin-when-cross-origin

# ログ設定
logging:
  level: info

# モニタリング設定
monitoring:
  enabled: true