# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 100
  concurrency: 80
  cpu: 2
  memoryMiB: 1024

# Environment variables and secrets.
env:
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  # - variable: MESSAGE
  #   value: Hello world!
  #   availability:
  #     - BUILD
  #     - RUNTIME
  # --- 1. 
  # Firebase Configuration
  # Fireabase app-id
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:17375032053:web:e1f99ead356f5421c1cbbc
    availability:
      - BUILD
      - RUNTIME

  # firebase project-id
  - variable: FIREBASE_PROJECT_ID
    value: caglla-fb
    availability:
      - BUILD
      - RUNTIME

  # firebase project-id
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: caglla-fb
    availability:
      - BUILD
      - RUNTIME

  # firebase auth-domain
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: caglla-fb.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  # firebase storage-bucket
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: caglla-fb.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  # firebase messaging-sender-id
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 17375032053
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBzEYw-gYSfPHQICFtaRB4gMzMkR5z8EN4
    availability:
      - BUILD
      - RUNTIME
      



  # Grant access to secrets in Cloud Secret Manager.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  # Firebase Admin SDK Configuraiton
  - variable: FIREBASE_CLIENT_EMAIL
    secret: caglla-firebase-client-email
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_PRIVATE_KEY
    secret: caglla-firebase-private-key
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_GOOGLE_PLACES_API_KEY
    # secret: caglla-google-places-api-key
    secret: caglla-frontend-places
    availability:
      - BUILD
      - RUNTIME
  
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    #secret: caglla-google-maps-api-key
    secret: caglla-frontend-maps
    availability:
      - BUILD
      - RUNTIME
  
  - variable: GOOGLE_PLACES_API_KEY
    secret: caglla-backend-places
    availability:
      - RUNTIME
  
  - variable: GOOGLE_MAPS_API_KEY
    secret: caglla-backend-maps
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_GOOGLE_MAP_ID
    secret: caglla-google-map-id
    availability:
      - BUILD
      - RUNTIME
  
  # --- 3. Sendgrid
  # firebase functions も利用している可能性があるので、secrets mangager のキー名普遍
  - variable: SENDGRID_API_KEY
    secret: SENDGRID_API_KEY
    availability:
      - RUNTIME
  
  # --- 4. Unsplash
  - variable: NEXT_PUBLIC_UNSPLASH_APP_ID
    secret: caglla-unsplash-app-id
    availability:
      - BUILD
      - RUNTIME
  
  - variable: NEXT_PUBLIC_UNSPLASH_ACCESS_KEY
    secret: caglla-unsplash-access-key
    availability:
      - BUILD
      - RUNTIME
  
  - variable: UNSPLASH_ACCESS_KEY
    secret: caglla-unsplash-access-key
    availability:
      - RUNTIME
  
  - variable: UNSPLASH_SECRET_KEY
    secret: caglla-unsplash-secret-key
    availability:
      - RUNTIME
  
  # --- 5. TripAdvisor
  - variable: TRIPADVISOR_API_KEY
    secret: caglla-tripadvisor-api-key
    availability:
      - RUNTIME
  
  # --- 6. Foursquare
  - variable: FOURSQUARE_API_KEY
    secret: caglla-foursquare-api-key
    availability:
      - RUNTIME
  
  # --- 7. SelectPDF
  - variable: SELECTPDF_API_KEY
    secret: caglla-selectpdf-api-key
    availability:
      - RUNTIME
  
  # --- 8. Node.js
  - variable: NODE_ENV
    value: production

  - variable: NEXT_PUBLIC_APP_URL
    value: https://caglla.travel

  - variable: NEXTAUTH_URL
    value: https://caglla.travel/

  # --- 9. Stripe
  - variable: NEXT_PUBLIC_PRODUCT_ID
    secret: caglla-stripe-product-id
    availability:
      - BUILD
      - RUNTIME

  ## fix typo in Google Secret Manager
  - variable: STRIPE_PRICE_SEASON_TRAVELER
    secret: caglla-stripe-price-season-traveler
    availability:
      - BUILD
      - RUNTIME

  - variable: STRIPE_PRICE_BACKPACKER
    secret: caglla-stripe-price-backpacker
    availability:
      - BUILD
      - RUNTIME

  - variable: STRIPE_PRICE_GLOBETROTTER
    secret: caglla-stripe-price-globetrotter
    availability:
      - BUILD
      - RUNTIME