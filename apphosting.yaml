# Firebase App Hosting Configuration
# https://firebase.google.com/docs/app-hosting

# アプリケーション情報
appConfig:
  # package.jsonから取得した情報
  name: caglla
  version: 1.8.2
  description: Travel management app inspired by wanderlog
  private: true

# ランタイム設定
runConfig:
  # Node.js 22を使用（package.jsonのvolta設定に合わせる）
  runtime: nodejs22
  
  # 環境変数の設定（Google Cloud Secret Manager連携）
  env:
    # Firebase Configuration (クライアント側) - Secret Managerから取得
    - variable: NEXT_PUBLIC_FIREBASE_API_KEY
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_FIREBASE_API_KEY/versions/latest
    - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN/versions/latest
    - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_FIREBASE_PROJECT_ID/versions/latest
    - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET/versions/latest
    - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID/versions/latest
    - variable: NEXT_PUBLIC_FIREBASE_APP_ID
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_FIREBASE_APP_ID/versions/latest
    
    # Firebase Admin SDK Configuration (サーバー側) - Secret Managerから取得
    - variable: FIREBASE_PROJECT_ID
      secret: projects/caglla-fb/secrets/FIREBASE_PROJECT_ID/versions/latest
    - variable: FIREBASE_CLIENT_EMAIL
      secret: projects/caglla-fb/secrets/FIREBASE_CLIENT_EMAIL/versions/latest
    - variable: FIREBASE_PRIVATE_KEY
      secret: projects/caglla-fb/secrets/FIREBASE_PRIVATE_KEY/versions/latest
    
    # Google APIs Configuration - Secret Managerから取得
    - variable: NEXT_PUBLIC_GOOGLE_PLACES_API_KEY
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_GOOGLE_PLACES_API_KEY/versions/latest
    - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_GOOGLE_MAPS_API_KEY/versions/latest
    - variable: NEXT_PUBLIC_GOOGLE_MAP_ID
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_GOOGLE_MAP_ID/versions/latest
    
    # App URL (本番環境用) - Secret Managerから取得
    - variable: NEXT_PUBLIC_APP_URL
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_APP_URL/versions/latest
    
    # Optional APIs (必要に応じて設定) - Secret Managerから取得
    - variable: NEXT_PUBLIC_UNSPLASH_APP_ID
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_UNSPLASH_APP_ID/versions/latest
    - variable: NEXT_PUBLIC_UNSPLASH_ACCESS_KEY
      secret: projects/caglla-fb/secrets/NEXT_PUBLIC_UNSPLASH_ACCESS_KEY/versions/latest
    - variable: UNSPLASH_SECRET_KEY
      secret: projects/caglla-fb/secrets/UNSPLASH_SECRET_KEY/versions/latest
    
    # External APIs (サーバーサイド専用) - Secret Managerから取得
    - variable: TRIPADVISOR_API_KEY
      secret: projects/caglla-fb/secrets/TRIPADVISOR_API_KEY/versions/latest
    - variable: FOURSQUARE_API_KEY
      secret: projects/caglla-fb/secrets/FOURSQUARE_API_KEY/versions/latest
    - variable: SELECTPDF_API_KEY
      secret: projects/caglla-fb/secrets/SELECTPDF_API_KEY/versions/latest
    
    # SendGrid Configuration - Secret Managerから取得
    - variable: SENDGRID_API_KEY
      secret: projects/caglla-fb/secrets/SENDGRID_API_KEY/versions/latest

# ビルド設定
buildConfig:
  # ビルドコマンド（環境変数を設定してからビルド）
  buildCommand: |
    export NEXT_PUBLIC_FIREBASE_API_KEY=$(gcloud secrets versions access latest --secret="NEXT_PUBLIC_FIREBASE_API_KEY" --project="caglla-fb") &&
    export NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$(gcloud secrets versions access latest --secret="NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" --project="caglla-fb") &&
    export NEXT_PUBLIC_FIREBASE_PROJECT_ID=$(gcloud secrets versions access latest --secret="NEXT_PUBLIC_FIREBASE_PROJECT_ID" --project="caglla-fb") &&
    export NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$(gcloud secrets versions access latest --secret="NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" --project="caglla-fb") &&
    export NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$(gcloud secrets versions access latest --secret="NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" --project="caglla-fb") &&
    export NEXT_PUBLIC_FIREBASE_APP_ID=$(gcloud secrets versions access latest --secret="NEXT_PUBLIC_FIREBASE_APP_ID" --project="caglla-fb") &&
    export NEXT_PUBLIC_GOOGLE_PLACES_API_KEY=$(gcloud secrets versions access latest --secret="NEXT_PUBLIC_GOOGLE_PLACES_API_KEY" --project="caglla-fb") &&
    export NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$(gcloud secrets versions access latest --secret="NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" --project="caglla-fb") &&
    export NEXT_PUBLIC_GOOGLE_MAP_ID=$(gcloud secrets versions access latest --secret="NEXT_PUBLIC_GOOGLE_MAP_ID" --project="caglla-fb") &&
    export NEXT_PUBLIC_APP_URL=$(gcloud secrets versions access latest --secret="NEXT_PUBLIC_APP_URL" --project="caglla-fb") &&
    pnpm install --no-frozen-lockfile && pnpm run build
  
  # 出力ディレクトリ（Next.jsのデフォルト）
  outputDirectory: .next
  
  # Node.js バージョン
  nodeVersion: 22
  
  # pnpmバージョン指定（現在のバージョン）
  pnpmVersion: 10.18.3
  
  # package.jsonの依存関係情報（参考）
  dependencies:
    # 主要な依存関係
    next: "^14.2.33"
    react: "18.3.1"
    react-dom: "18.3.1"
    typescript: "^5.9.3"
    firebase: "^10.14.1"
    firebase-admin: "^13.5.0"
    "@google-cloud/secret-manager": "^6.1.1"
    "@googlemaps/js-api-loader": "^1.16.10"
    "@iconify/react": "6.0.2"
    "@dnd-kit/core": "^6.3.1"
    "@dnd-kit/sortable": "^10.0.0"
    "@dnd-kit/utilities": "^3.2.2"
    "@types/qrcode": "^1.5.5"
    qrcode: "^1.5.4"
    axios: "^1.12.2"
    mysql2: "^3.15.2"
    firebase-tools: "^14.20.0"
  
  # package.jsonのスクリプト情報（参考）
  scripts:
    dev: "next dev"
    build: "next build"
    start: "next start"
    lint: "next lint"
    migrate: "ts-node src/migrate.ts"
    flush-itineraries: "ts-node scripts/flush-itineraries.ts"
    manage-itineraries: "ts-node scripts/manage-itineraries.ts"
    simple-flush: "ts-node scripts/simple-flush.ts"
    admin-flush: "ts-node scripts/admin-flush.ts"
    api-flush: "ts-node scripts/api-flush.ts"
    setup-secrets: "ts-node scripts/setup-secrets.ts"

# デプロイ設定
deployConfig:
  # リージョン（アジア太平洋地域を推奨）
  region: asia-northeast1
  
  # スケーリング設定
  scaling:
    minInstances: 1
    maxInstances: 10
  
  # ヘルスチェック設定
  healthCheck:
    path: /api/health
    timeoutSeconds: 30
  
  # カスタムドメイン設定（必要に応じて）
  # customDomains:
  #   - your-domain.com
  #   - www.your-domain.com

# セキュリティ設定
security:
  # HTTPS強制
  forceHttps: true
  
  # セキュリティヘッダー
  headers:
    - name: X-Frame-Options
      value: DENY
    - name: X-Content-Type-Options
      value: nosniff
    - name: X-XSS-Protection
      value: 1; mode=block
    - name: Referrer-Policy
      value: strict-origin-when-cross-origin

# ログ設定
logging:
  level: info
  
# モニタリング設定
monitoring:
  enabled: true
